ball_detector_node:
  ros__parameters:
    image_topic: "/camera/image_raw"
    depth_topic: "/camera/depth/image_raw"
    camera_info_topic: "/camera/camera_info"

    camera_frame: "camera_optical_frame"
    map_frame: "map"

    h_min: 20
    h_max: 45
    s_min: 100
    s_max: 255
    v_min: 80
    v_max: 255

    min_area: 30.0
    max_area: 50000.0
    min_radius_px: 2.0
    min_depth_m: 0.15
    max_depth_m: 8.0
    morphology_kernel_size: 5

    sync_queue_size: 10
    sync_slop_sec: 0.10
