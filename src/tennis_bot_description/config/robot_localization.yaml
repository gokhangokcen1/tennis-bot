ekf_filter_node:
  ros__parameters:
    frequency: 30.0 # saniyede 30 kez tahmin üret
    sensor_timeout: 0.2 # 0.2 sn veri gelmezse yine de tahmin et

    two_d_mode: true # düz zemin: z, roll, pitch 0 
    publish_tf: true # odom -> base_footprint TF publish et

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint 
    world_frame: odom # EKF, odom'u çalıştırıyor

    odom0: /diff_drive_controller/odom
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    #config:
    #  [x y z
    # roll pitch yaw
    # vx vy vz 
    # vroll vpitch vyaw
    # ax ay az]
    odom0_config:
      [true, true, false,
       false, false, true,
       true, false, false,
       false, false, true,
       false, false, false]

    imu0: /imu
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_config:
      [false, false, false,
       false, false, true,
       false, false, false,
       false, false, true,
       false, false, false]
